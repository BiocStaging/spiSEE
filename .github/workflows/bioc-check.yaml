# R CMD check + BiocCheck on Bioconductor devel, in Bioconductor's own
# docker image (same R / Bioconductor versions as its devel builders).
# Runs on pushes to ci/* branches and by hand (Actions tab > Run workflow).
name: bioc-check

on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    timeout-minutes: 150
    env:
      NOT_CRAN: true
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: Rscript -e 'print(R.version.string); print(BiocManager::version())'

      - name: Cache installed packages
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/R/site-library
          key: rlib-${{ hashFiles('DESCRIPTION') }}-v1
          restore-keys: rlib-

      - name: Install dependencies
        run: |
          Rscript -e 'BiocManager::install(c("remotes", "rcmdcheck", "BiocCheck"), ask = FALSE, update = FALSE)'
          Rscript -e 'deps <- remotes::local_package_deps(dependencies = TRUE); BiocManager::install(deps, ask = FALSE, update = FALSE)'
          Rscript -e 'for (p in c("iSEE", "SpatialExperiment", "SpaceTrooper", "SpatialFeatureExperiment", "Voyager", "spatialFDA")) cat(p, as.character(packageVersion(p)), "\n")'

      - name: R CMD check
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--timings"), build_args = "--no-manual", error_on = "warning", check_dir = "check")'

      - name: BiocCheck
        if: always()
        run: |
          R CMD build --no-manual .
          Rscript -e 'BiocCheck::BiocCheck(list.files(pattern = "[.]tar[.]gz$"), `new-package` = TRUE)'

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            check/*.Rcheck/00check.log
            check/*.Rcheck/00install.out
            check/*.Rcheck/tests/testthat.Rout*
            *.BiocCheck/00BiocCheck.log
          if-no-files-found: ignore
